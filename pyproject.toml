[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-engine"
version = "0.1.0"
description = "General paper knowledge extraction and simulation reproduction engine"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6",
  "Jinja2>=3.1",
  "jsonschema>=4.18",
  "pymupdf4llm>=0.0.17",
  "requests>=2.31",
  "pexpect>=4.8; platform_system != 'Windows'",
]

[project.optional-dependencies]
simulation = ["numpy>=1.26"]
test = ["pytest>=8"]

[project.scripts]
paper_engine = "paper_engine.cli:main"
battery_lit = "paper_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
