[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silicon-carbon-anode-literature"
version = "0.1.0"
description = "Literature research workflow for silicon-carbon anodes in traction batteries"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6",
  "Jinja2>=3.1",
  "jsonschema>=4.18",
  "pymupdf4llm>=0.0.17",
  "requests>=2.31",
]

[project.scripts]
battery_lit = "battery_lit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
