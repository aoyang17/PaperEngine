<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Candidates</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav><a href="dashboard.html">Dashboard</a><a href="candidates.html">Candidates</a><a href="library.html">Library</a></nav>
  <main>
    <h1>Candidates</h1>
    <table>
      <thead><tr><th>ID</th><th>Year</th><th>Venue</th><th>Score</th><th>Status</th><th>Title</th><th>Authors</th></tr></thead>
      <tbody>
      {% for c in candidates %}
        <tr>
          <td>{{ c.candidate_id }}</td>
          <td>{{ c.year or "" }}</td>
          <td>{{ c.venue }}</td>
          <td>{{ "%.2f"|format(c.score) }}</td>
          <td>{{ c.status }}</td>
          <td>{{ c.title }}</td>
          <td>{{ ", ".join(c.authors) }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </main>
</body>
</html>
